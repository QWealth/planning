<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The favicon is an inline data URI rather than a file in public/.

      Anything in public/ lands at the root of dist/ with an unhashed name, and
      cdk/lib/frontend_stack.py's second BucketDeployment uploads everything except
      index.html with `max-age=31536000, immutable`. A year of immutable caching is
      correct for Vite's content-hashed assets and wrong for a stable filename -
      replacing the icon later would leave the old one pinned in every viewer's
      browser and at every edge. Inlining it sidesteps the whole question, and it
      rides in index.html which is served no-cache.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E0218A'/%3E%3Crect x='6' y='8' width='20' height='4' rx='2' fill='%23FFD9EC'/%3E%3Crect x='6' y='14' width='13' height='4' rx='2' fill='%23FFD9EC'/%3E%3Crect x='6' y='20' width='17' height='4' rx='2' fill='%23FFD9EC'/%3E%3C/svg%3E"
    />
    <title>Planning Roadmap - QWealth</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
